[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "enzymatic-kinetics-analyzer"
version = "2.0.1"
description = "Michaelis-Menten, dose-response and inhibition-model fitting with t-based confidence intervals, replicate-aware batch processing and model comparison"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oluwaseun O. Ajayi", email = "oluwaseun.ajayi@uga.edu" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "matplotlib>=3.4"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Oluwaseun-O-Ajayi/enzymatic-kinetics-analyzer"
Issues = "https://github.com/Oluwaseun-O-Ajayi/enzymatic-kinetics-analyzer/issues"

[tool.setuptools.packages.find]
include = ["enzyme_kinetics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
